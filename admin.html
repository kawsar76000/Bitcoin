<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ADMIN | SATOSHI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #111; color: #fff; }
        .admin-wrapper { max-width: 1200px; margin: 120px auto; padding: 20px; display: none; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .search-bar { width: 300px; padding: 12px; background: #222; border: 1px solid #444; color: #fff; font-family: inherit; }
        table { width: 100%; border-collapse: collapse; background: #1a1a1a; text-align: left;}
        th, td { padding: 12px; border-bottom: 1px solid #333; font-size: 13px; }
        th { background: #000; color: var(--gold); }
        .btn-approve { background: #2e7d32; color: #fff; border: none; padding: 6px 12px; cursor: pointer; }
        .btn-delete { background: #c62828; color: #fff; border: none; padding: 6px 12px; cursor: pointer; }
        .btn-edit { background: #1976d2; color: #fff; border: none; padding: 6px 12px; cursor: pointer; }
        
        .login-box { margin: 150px auto; background: #fff; color: #000; padding: 40px; width: 300px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="loginBox" class="login-box">
        <h2>ADMIN LOGIN</h2>
        <input type="email" id="admin-email" placeholder="Email">
        <input type="password" id="admin-pass" placeholder="Password">
        <button style="width:100%; padding:12px; background:#000; color:#fff; border:none; cursor:pointer;" onclick="checkAdmin()">LOGIN</button>
    </div>

    <div id="adminPanel" class="admin-wrapper">
        <div class="top-bar">
            <h1 style="color:var(--gold); margin:0;">USER MANAGEMENT</h1>
            <input type="text" id="search-input" class="search-bar" placeholder="Search Mobile Number..." onkeyup="filterTable()">
        </div>

        <table id="user-table">
            <thead>
                <tr><th>Mobile</th><th>Name</th><th>Status</th><th>Referrals</th><th>Actions</th></tr>
            </thead>
            <tbody id="user-list"></tbody>
        </table>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allUsers = [];

        window.checkAdmin = function() {
            if(document.getElementById('admin-email').value === "zoomlink34@gmail.com" && document.getElementById('admin-pass').value === "KAWSARahmed22@@") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadUsers();
            } else { alert("Access Denied!"); }
        }

        function loadUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                allUsers = [];
                snapshot.forEach((doc) => { allUsers.push({ id: doc.id, ...doc.data() }); });
                renderTable(allUsers);
            });
        }

        function renderTable(users) {
            const tbody = document.getElementById('user-list');
            tbody.innerHTML = "";
            users.forEach(user => {
                // রেফারেল কাউন্ট হিসাব করা (এই ইউজারের নাম্বার কতজন ব্যবহার করেছে)
                const refCount = allUsers.filter(u => u.referredBy === user.phone).length;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.phone}</td>
                    <td>${user.name}</td>
                    <td style="color:${user.status==='approved'?'#4caf50':'#ff9800'}">${user.status.toUpperCase()}</td>
                    <td><b>${refCount}</b> users</td>
                    <td>
                        ${user.status === 'pending' ? `<button class="btn-approve" onclick="approveUser('${user.id}')">Approve</button>` : ''}
                        <button class="btn-delete" onclick="deleteUser('${user.id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.filterTable = function() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = allUsers.filter(u => u.phone.includes(search) || u.name.toLowerCase().includes(search));
            renderTable(filtered);
        }

        window.approveUser = async function(id) {
            if(confirm("Approve this user? Balance will be added.")) {
                await updateDoc(doc(db, "users", id), { status: "approved", balance: 2.00 });
            }
        }

        window.deleteUser = async function(id) {
            if(confirm("Delete this user permanently?")) {
                await deleteDoc(doc(db, "users", id));
            }
        }
    </script>
</body>
</html>
